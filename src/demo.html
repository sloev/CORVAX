<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORVAX demo</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--fg:#1b1d22;--bg:#fbfaf7;--mute:#5d6170;--line:#d8d4ca;--code:#f1eee6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e6e1;--bg:#141519;--mute:#9a9ca6;--line:#34363e;--code:#1d1f24}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:44rem;padding:1.5rem 1rem 3rem;font:16px/1.55 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
header{display:flex;align-items:center;gap:.8rem}
h1{font-size:1.4rem;margin:0;letter-spacing:.06em}
code{font:13px ui-monospace,monospace;background:var(--code);padding:.15rem .35rem;border-radius:5px;word-break:break-all}
input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem}
input{width:100%;min-width:0}
button{cursor:pointer;white-space:nowrap}
.row{display:flex;gap:.5rem;margin:.6rem 0}
#log{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;margin-top:1rem;color:var(--mute)}
</style>
<header><img src="/logo" width="40" height="40" alt=""><h1>CORVAX demo</h1></header>
<p>Your address (share it): <code id="me">…</code></p>
<div class="row"><input id="to" placeholder="Address to connect to" aria-label="Address"><button id="go">Connect</button></div>
<div class="row"><input id="msg" placeholder="Message" aria-label="Message" disabled><button id="send" disabled>Send</button></div>
<div id="log" role="log"></div>
<script type="module">
  import { Peer } from '/cx/index.js'
  const $ = id => document.getElementById(id)
  const log = s => { $('log').textContent += s + '\n' }
  let seed = null
  try { seed = localStorage.getItem('corvax.seed') } catch {}
  const me = await Peer.create({ seed, allowPrivate: ['localhost', '127.0.0.1'].includes(location.hostname) })
  try { localStorage.setItem('corvax.seed', me.seed) } catch {}
  $('me').textContent = me.address
  await me.publish()
  log(`ready · ${me.inboxes.length} inbox anchor(s)`)

  let channel
  const use = (ch, who, kind) => {
    channel = ch
    ch.onmessage = e => log(`${who.slice(0, 8)}: ${e.data}`)
    $('msg').disabled = $('send').disabled = false
    log(`connected to ${who.slice(0, 8)}… (${kind})`)
  }
  me.accept(({ from, channel, kind }) => use(channel, from, kind))
  $('go').onclick = async () => {
    const to = $('to').value.trim()
    log(`connecting to ${to.slice(0, 8)}…`)
    try { const r = await me.connect(to); use(r.channel, to, r.kind) } catch (e) { log(`failed: ${e.code || e.message}`) }
  }
  $('send').onclick = () => { channel.send($('msg').value); log(`me: ${$('msg').value}`); $('msg').value = '' }
</script>
</html>
