name: test
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * *'          # nightly: catches browser and runtime updates early

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium firefox webkit
      - run: npm test
        env: { BROWSERS: 'chromium,firefox,webkit' }

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test/runtime-smoke.js

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno install
      - run: deno run -A test/runtime-smoke.js
