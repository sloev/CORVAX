# One small job, only when code changes. Firefox and WebKit run only when triggered by hand.
name: test
on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'bin/**', 'package*.json', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'test/**', 'bin/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers to test'
        default: 'chromium,firefox,webkit'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci && npm run build
      - name: Browsers
        env: { BROWSERS: "${{ inputs.browsers || 'chromium' }}" }
        run: npm i --no-save playwright && npx playwright install --with-deps ${BROWSERS//,/ }
      - name: Node (incl. browsers)
        env: { BROWSERS: "${{ inputs.browsers || 'chromium' }}" }
        run: npm test
      - name: Bun
        run: bun test/runtime-smoke.js
      - name: Deno
        run: deno run -A test/runtime-smoke.js

  # Every green push to main is a release: v<major.minor from package.json>.<run number>, published to npm
  # (jsDelivr then serves @sloev/corvax@0.1 to browsers), a GitHub release with the bundle and tarball, `latest` moved
  # to it, and only the 10 newest releases kept. npm: trusted publishing for this repo, or an NPM_TOKEN secret.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write, id-token: write }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci && npm i -g npm@11
      - name: Version and build
        run: |
          V=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}
          echo "V=$V" >> "$GITHUB_ENV"
          npm version "$V" --no-git-tag-version
          CORVAX_VERSION=$V npm run build
          npm pack
      - name: Tag and release, keep the 10 newest
        run: |
          git tag "v$V"; git tag -f latest
          git push origin "v$V"; git push -f origin latest
          gh release create "v$V" dist/corvax.min.js "sloev-corvax-$V.tgz" --title "v$V" --latest \
            --notes "npm i @sloev/corvax@$V · import { Peer } from 'https://cdn.jsdelivr.net/npm/@sloev/corvax@$V/dist/corvax.min.js'"
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:][].tagName' |
            xargs -r -n1 gh release delete --yes --cleanup-tag
      - name: Publish to npm
        continue-on-error: true          # until npm is set up, releases still happen
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          npm publish "sloev-corvax-$V.tgz" --provenance --access public
          curl -fsS https://purge.jsdelivr.net/npm/@sloev/corvax@0.1/dist/corvax.min.js || true
